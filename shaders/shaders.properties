blend.gbuffers_hand=off
blend.gbuffers_textured_lit=off
blend.gbuffers_weather= ONE ONE ONE ONE
blend.gbuffers_basic= off
blend.gbuffers_entities = off

clouds = off
sun = false
moon = false
sky = false



iris.features.required=CUSTOM_IMAGES SSBO SEPARATE_HARDWARE_SAMPLERS BLOCK_EMISSION_ATTRIBUTE HIGHER_SHADOWCOLOR
separteAo = true
shadow.culling = reversed

voxelizeLightBlocks = true

#if VOXEL_AREA == 256
	image.voxelization = voxelMap RED_INTEGER R32UI UNSIGNED_INT true false 256 256 256
#elif VOXEL_AREA == 128
	image.voxelization = voxelMap RED_INTEGER R32UI UNSIGNED_INT true false 128 128 128
#elif VOXEL_AREA == 64
	image.voxelization = voxelMap RED_INTEGER R32UI UNSIGNED_INT true false 64 64 64

#elif VOXEL_AREA == 32
	image.voxelization = voxelMap RED_INTEGER R32UI UNSIGNED_INT true false 32 32 32
#endif

#if VOXEL_AREA == 256
	image.voxelization1 = voxelMap2 RED_INTEGER R32UI UNSIGNED_INT true false 256 256 256
#elif VOXEL_AREA == 128
	image.voxelization1 = voxelMap2 RED_INTEGER R32UI UNSIGNED_INT true false 128 128 128
#elif VOXEL_AREA == 64
	image.voxelization1 = voxelMap2 RED_INTEGER R32UI UNSIGNED_INT true false 64 64 64
#elif VOXEL_AREA == 32
	image.voxelization1 = voxelMap2 RED_INTEGER R32UI UNSIGNED_INT true false 32 32 32
#endif

#//floodfill image
#if VOXEL_AREA == 256
	image.floodfill = voxelFloodfill RGBA RGBA8 BYTE false false 256 512 256
#elif VOXEL_AREA == 128
	image.floodfill = voxelFloodfill RGBA RGBA8 BYTE false false 128 256 128
#elif VOXEL_AREA == 64
	image.floodfill = voxelFloodfill RGBA RGBA8 BYTE false false 64 128 64
#elif  VOXEL_AREA == 32
	image.floodfill = voxelFloodfill RGBA RGBA8 BYTE false false 32 64 32
#endif

#if VOXEL_AREA == 256
	image.floodfill2 = voxelFloodfill2 RGBA RGBA8 BYTE false false 256 512 256
#elif VOXEL_AREA == 128
	image.floodfill2 = voxelFloodfill2 RGBA RGBA8 BYTE false false 128 256 128
#elif VOXEL_AREA == 64
	image.floodfill2 = voxelFloodfill2 RGBA RGBA8 BYTE false false 64 128 64
#elif VOXEL_AREA == 32
	image.floodfill2 = voxelFloodfill2 RGBA RGBA8 BYTE false false 32 64 32
#endif

DO_CHROMATIC_ABERRATION = false	
	
uniform.float.PaleGardenSmooth = smooth(2, if(biome == BIOME_PALE_GARDEN, 1.0, 0.0), 9.0, 5.0)

uniform.bool.isColdBiome = in(biome, BIOME_SNOWY_PLAINS, BIOME_SNOWY_TAIGA, BIOME_GROVE, BIOME_FROZEN_RIVER, BIOME_ICE_SPIKES, BIOME_SNOWY_SLOPES, BIOME_FROZEN_PEAKS, BIOME_FROZEN_OCEAN)

uniform.bool.isHotBiome = in(biome_category, CAT_MESA, CAT_SAVANNA, CAT_DESERT)
uniform.bool.isJungle = in(biome_category,CAT_JUNGLE)

uniform.float.snowBiomeSmooth = smooth(2, if(!isColdBiome, 1.0, 0.0), 15.0, 7.0)
uniform.float.hotBiomeSmooth = smooth(2, if(!isHotBiome, 1.0, 0.0), 25.0, 25.0)
uniform.float.jungleSmooth = smooth(2, if(isJungle, 1.0, 0.0), 25.0, 7.0)

customTexture.blueNoiseTex = /textures/stbn.bin TEXTURE_3D RGB8 128 128 64 RGB UNSIGNED_BYTE


customTexture.fogTex = /textures/fogTex.png
customTexture.puddleTex = /textures/puddle_noise.png
customTexture.waterTex = /textures/water_noise.png
customTexture.clouds = /textures/clouds.png
customTexture.cloudBase = /textures/cloudTex.png 
customTexture.detail = /textures/detail.png 
customTexture.lensDirt = /textures/lens_dirt.png 

screen = NAME <empty> <empty>  <empty> [LightingShading] [Atmosphere] [Water] [PostProcessing] 
screen.columns = 1
screen.Post-Processing.columns = 1
screen.Atmosphere.columns = 1

screen.LightingShading = [Shadows] [Materials] [VoxelLighting] [AmbientOcclusion] 
screen.VoxelLighting = FLOODFILL VOXEL_AREA MAX_FLOODFILL_INTENSITY 
screen.Shadows = SUN_ROTATION SHADOW_RESOLUTION SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTANCE 
screen.AmbientOcclusion = AO_METHOD SSAO_SAMPLES SSAO_RADIUS SSAO_INTENSITY FILTER_AO SSAO_TA_FACTOR VANILLA_AO_LEVEL
screen.Materials = HC_SSS HC_EMISSION <empty> <empty> <empty>  <empty> DO_SSR SSR_STEPS <empty> <empty> ROUGH_REFLECTION ROUGH_SAMPLES <empty> <empty> BINARY_REFINEMENT BINARY_COUNT SSR_MIP_BLUR

screen.Atmosphere = [Sky] [Fog] [Clouds]
screen.Sky = SUN_ANGULAR_RADIUS_MULT MOON_ANGULAR_RADIUS_MULT SUN_BRIGHTNESS_MULT MOON_BRIGHTNESS_MULT  [SkyColors]
screen.SkyColors =  [ZenithColors] [HorizonColors] [GroundColors]
screen.ZenithColors = DAY_ZENITH_COLOR_R DAY_ZENITH_COLOR_G DAY_ZENITH_COLOR_B <empty> <empty> <empty> DAWN_ZENITH_COLOR_R DAWN_ZENITH_COLOR_G DAWN_ZENITH_COLOR_B <empty> <empty>  <empty> DUSK_ZENITH_COLOR_R DUSK_ZENITH_COLOR_G DUSK_ZENITH_COLOR_B <empty> <empty> <empty> NIGHT_ZENITH_COLOR_R NIGHT_ZENITH_COLOR_G NIGHT_ZENITH_COLOR_B
screen.HorizonColors = DAY_HORIZON_COLOR_R DAY_HORIZON_COLOR_G DAY_HORIZON_COLOR_B <empty> <empty> <empty> DAWN_HORIZON_COLOR_R DAWN_HORIZON_COLOR_G DAWN_HORIZON_COLOR_B <empty> <empty> <empty> DUSK_HORIZON_COLOR_R DUSK_HORIZON_COLOR_G DUSK_HORIZON_COLOR_B <empty> <empty> <empty> NIGHT_HORIZON_COLOR_R NIGHT_HORIZON_COLOR_G NIGHT_HORIZON_COLOR_B
screen.GroundColors = DAY_GROUND_COLOR_R DAY_GROUND_COLOR_G DAY_GROUND_COLOR_B <empty> <empty> <empty> DAWN_GROUND_COLOR_R DAWN_GROUND_COLOR_G DAWN_GROUND_COLOR_B <empty> <empty> <empty> DUSK_GROUND_COLOR_R DUSK_GROUND_COLOR_G DUSK_GROUND_COLOR_B <empty> <empty> <empty> NIGHT_GROUND_COLOR_R NIGHT_GROUND_COLOR_G NIGHT_GROUND_COLOR_B
screen.Fog.columns = 1
screen.Fog =  VOLUMETRICS [BasicVolumetricFogSettings] [AdvancedFogSettings] [FogPhase] 
screen.FogPhase = MORNING_PHASE DAY_PHASE NOON_PHASE EVENING_PHASE NIGHT_PHASE <empty> <empty> <empty> FORWARD_PHASE_INTENSITY BACKWARD_PHASE_INTENSITY
screen.AdvancedFogSettings = TRACING_DISTANCE STEP_SIZE MAX_HEIGHT MIN_HEIGHT FOG_DENSITY NOISE_SAMPLING WEATHER_DENSITY MS_FALLOFF MS_POWER  [Noise-Configuration] 
screen.BasicVolumetricFogSettings = VL_SAMPLES  VL_EXT MULTI_SCATTER_INTENSITY
screen.Clouds =   CLOUDS CLOUD_STYLE CLOUD_DENSITY CLOUD_PLANE_BOTTOM CLOUD_PLANE_TOP  CLOUD_THICKNESS CLOUD_NOISE_SCALE CLOUD_DENSITY_THRESHOLD CLOUD_DISTANCE_TYPE CLOUD_DISTANCE
screen.Noise-Configuration = NOISE_SCALE  WIND_SPEED DENSITY_THRESHOLD 
screen.Water = WAVES WAVE_FREQUENCY WAVE_SPEED WAVE_OCTAVES WAVE_PULL WAVE_INTENSITY WAVE_RANDOMNESS

screen.PostProcessing = [Bloom] [ColorGrading] [ChromaticAberration] [Reprojection]
screen.ColorGrading = BRIGHTNESS SATURATION CONTRAST
screen.Bloom = BLOOM_GLSL BLOOM_QUALITY BLOOM_RADIUS BLOOM_STRENGTH DO_LENS_DIRT BLOOM_LENS_DIRT_INTENSITY 
screen.Reprojection = TEMPORAL_REPROJECTION TA_FACTOR REFLECTION_FILTER SCREENSHOT_MODE 
screen.ChromaticAberration = DO_CHROMATIC_ABERRATION CHROMATIC_ABERRATION_INTENSITY CHROMATIC_ABERRATION_POWER

sliders = SSR_STEPS VL_SAMPLES SHADOW SAMPLES BLOOM_QUALITY SHADOW_SOFTNESS SHADOW_DISTANCE WAVE_FREQUENCY WAVE_SPEED WAVE_OCTAVES WAVE_PULL WAVE_INTENSITY WAVE_RANDOMNESS BLOOM_RADIUS BLOOM_STRENGTH BRIGHTNESS CONTRAST SATURATION WATER_FOG_DENSITY UNDERWATER_FOG_DENSITY SCATTER_COEFF ABSORPTION_COEFF ABSORPTION_R ABSORPTION_G ABSORPTION_B SCATTER_R SCATTER_G SCATTER_B ROUGH_SAMPLES BINARY_COUNT SUN_ANGULAR_RADIUS_MULT MOON_ANGULAR_RADIUS_MULT SUN_BRIGHTNESS_MULT MOON_BRIGHTNESS_MULT DAY_PHASE MORNING_PHASE NOON_PHASE EVENING_PHASE NIGHT_PHASE AMBIENT_FOG_MULT MULTI_SCATTER_INTENSITY VL_EXT TA_FACTOR FOG_DENSITY WEATHER_DENSITY TRACING_DISTANCE MS_FALLOFF MS_POWER STBN_SAMPLES STEP_SIZE WIND_SPEED DENSITY_THRESHOLD NOISE_SCALE CLOUD_NOISE_SCALE CLOUD_DENSITY_THRESHOLD CLOUD_PLANE_BOTTOM CLOUD_THICKNESS CLOUD_PLANE_TOP CLOUD_DENSITY CLOUD_DISTANCE MAX_HEIGHT MIN_HEIGHT SSAO_SAMPLES SSAO_RADIUS SSAO_INTENSITY VANILLA_AO_LEVEL SSAO_TA_FACTOR DAY_ZENITH_COLOR_R DAY_ZENITH_COLOR_G DAY_ZENITH_COLOR_B DUSK_ZENITH_COLOR_R DUSK_ZENITH_COLOR_G DUSK_ZENITH_COLOR_B NIGHT_ZENITH_COLOR_R NIGHT_ZENITH_COLOR_G NIGHT_ZENITH_COLOR_B DAY_HORIZON_COLOR_R DAY_HORIZON_COLOR_G DAY_HORIZON_COLOR_B DUSK_HORIZON_COLOR_R DUSK_HORIZON_COLOR_G DUSK_HORIZON_COLOR_B NIGHT_HORIZON_COLOR_R NIGHT_HORIZON_COLOR_G NIGHT_HORIZON_COLOR_B DAY_GROUND_COLOR_R DAY_GROUND_COLOR_G DAY_GROUND_COLOR_B DUSK_GROUND_COLOR_R DUSK_GROUND_COLOR_G DUSK_GROUND_COLOR_B NIGHT_GROUND_COLOR_R NIGHT_GROUND_COLOR_G NIGHT_GROUND_COLOR_B DAWN_ZENITH_COLOR_R DAWN_ZENITH_COLOR_G DAWN_ZENITH_COLOR_B DAWN_HORIZON_COLOR_R DAWN_HORIZON_COLOR_G DAWN_HORIZON_COLOR_B DAWN_GROUND_COLOR_R DAWN_GROUND_COLOR_G DAWN_GROUND_COLOR_B MAX_FLOODFILL_INTENSITY BLOOM_LENS_DIRT_INTENSITY CHROMATIC_ABERRATION_INTENSITY CHROMATIC_ABERRATION_POWER